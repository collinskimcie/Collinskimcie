<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Animated eDEX-UI style launcher: a short boot log, then a profile for Santan, an embedded systems and cybersecurity tinkerer, with a tree of the tech stack" xmlns:c2pa="http://c2pa.org/manifest">
<title>santan@lab</title>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#aacfd1" stroke-opacity="0.035"/></pattern></defs>
<style>
text{font-family:"Fira Code","JetBrains Mono","Courier New",monospace}
.dim{fill:#aacfd1;fill-opacity:.5} .ink{fill:#aacfd1} .hi{fill:#e6f7f8} .ok{fill:#7dffb2}
.line{opacity:0;animation:show .01s linear forwards}
@keyframes show{to{opacity:1}} @keyframes hide{to{opacity:0}}
.boot{animation:hide .4s linear 5.1s forwards}
.main{opacity:0;animation:show .7s linear 5.5s forwards}
.blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.boot{display:none} .main{opacity:1;animation:none} .line{opacity:1;animation:none} .blink{animation:none}}
</style>
<rect width="960" height="520" fill="#05080d"/>
<rect width="960" height="520" fill="url(#g)"/>

<g class="boot">
<text x="40" y="60" font-size="13" class="line hi" style="animation-delay:0.25s" >eDEX-UI Kernel version 2.2.8 boot at santan@lab</text>
<text x="40" y="104" font-size="13" class="line ok" style="animation-delay:0.89s" >[  OK  ] mount /dev/ttyACM0 (ESP32-S3)</text>
<text x="40" y="126" font-size="13" class="line ok" style="animation-delay:1.21s" >[  OK  ] load toolchain: PlatformIO</text>
<text x="40" y="148" font-size="13" class="line ok" style="animation-delay:1.53s" >[  OK  ] start service: mosquitto, TLS only</text>
<text x="40" y="170" font-size="13" class="line ok" style="animation-delay:1.85s" >[  OK  ] start service: docker backend-api</text>
<text x="40" y="192" font-size="13" class="line ok" style="animation-delay:2.17s" >[  OK  ] verify firmware image: sha256</text>
<text x="40" y="214" font-size="13" class="line ok" style="animation-delay:2.49s" >[  OK  ] arm rollback protection</text>
<text x="40" y="236" font-size="13" class="line ok" style="animation-delay:2.81s" >[  OK  ] seal secrets: gitignored</text>
<text x="40" y="280" font-size="13" class="line ink" style="animation-delay:3.45s" >Starting graphical interface ...</text>
<text x="40" y="302" font-size="13" class="line hi" style="animation-delay:3.77s" >Welcome santan</text>
</g>
<g class="main">
<g fill="none" stroke="#aacfd1" stroke-opacity=".45" stroke-width="1.5"><path d="M16 36V16h20"/><path d="M924 16h20v20"/><path d="M16 484v20h20"/><path d="M924 504h20v-20"/></g>
<text x="40" y="44" font-size="12" class="dim">santan@lab</text>
<text x="920" y="44" font-size="12" text-anchor="end" class="dim">github.com/collinskimcie</text>
<path d="M40 58H920" stroke="#aacfd1" stroke-opacity=".2"/>
<path d="M920 468H40" stroke="#aacfd1" stroke-opacity=".2"/>
<path d="M500 82V448" stroke="#aacfd1" stroke-opacity=".2"/>
<text x="40" y="128" font-size="40" letter-spacing="9" class="hi">SANTAN</text>
<text x="42" y="156" font-size="14" class="ink">Embedded systems and cybersecurity</text>
<text x="42" y="204" font-size="13" class="line hi" style="animation-delay:6.00s" >santan@lab:~$ cat about.txt</text>
<text x="42" y="228" font-size="13" class="line ink" style="animation-delay:6.45s" >I write firmware for ESP32-S3 boards and the</text>
<text x="42" y="252" font-size="13" class="line ink" style="animation-delay:6.90s" >tools around them. I build devices to survive</text>
<text x="42" y="276" font-size="13" class="line ink" style="animation-delay:7.35s" >being poked at, then I poke at them myself.</text>
<text x="42" y="300" font-size="13" class="line dim" style="animation-delay:7.80s" >Only on hardware and networks I own.</text>
<text x="42" y="348" font-size="13" class="line hi" style="animation-delay:8.70s" >santan@lab:~$ ./interests</text>
<text x="42" y="372" font-size="13" class="line ok" style="animation-delay:9.15s" >&gt; embedded systems</text>
<text x="42" y="396" font-size="13" class="line ok" style="animation-delay:9.60s" >&gt; cybersecurity</text>
<text x="42" y="420" font-size="13" class="line hi" style="animation-delay:10.05s" >santan@lab:~$</text>
<rect x="155.2" y="408" width="8" height="15" class="ink blink line" style="animation-delay:10.05s"/>
<text x="530" y="112" font-size="13" class="line hi" style="animation-delay:6.00s" >santan@lab:~$ tree ~/stack</text>
<text x="530" y="150" font-size="13" class="line" style="animation-delay:6.95s"><tspan class="dim">├─ </tspan><tspan class="hi">languages</tspan></text>
<text x="530" y="172" font-size="13" xml:space="preserve" class="line" style="animation-delay:7.15s"><tspan class="dim">      </tspan><tspan class="ink">C   C++   Python   PHP</tspan></text>
<text x="530" y="206" font-size="13" class="line" style="animation-delay:7.40s"><tspan class="dim">├─ </tspan><tspan class="hi">backend</tspan></text>
<text x="530" y="228" font-size="13" xml:space="preserve" class="line" style="animation-delay:7.60s"><tspan class="dim">      </tspan><tspan class="ink">.NET   Node.js   Express   Django   Laravel</tspan></text>
<text x="530" y="262" font-size="13" class="line" style="animation-delay:7.85s"><tspan class="dim">├─ </tspan><tspan class="hi">frontend</tspan></text>
<text x="530" y="284" font-size="13" xml:space="preserve" class="line" style="animation-delay:8.05s"><tspan class="dim">      </tspan><tspan class="ink">React   Angular</tspan></text>
<text x="530" y="318" font-size="13" class="line" style="animation-delay:8.30s"><tspan class="dim">├─ </tspan><tspan class="hi">data</tspan></text>
<text x="530" y="340" font-size="13" xml:space="preserve" class="line" style="animation-delay:8.50s"><tspan class="dim">      </tspan><tspan class="ink">PostgreSQL   MySQL   MongoDB   Supabase</tspan></text>
<text x="530" y="374" font-size="13" class="line" style="animation-delay:8.75s"><tspan class="dim">└─ </tspan><tspan class="hi">infra</tspan></text>
<text x="530" y="396" font-size="13" xml:space="preserve" class="line" style="animation-delay:8.95s"><tspan class="dim">      </tspan><tspan class="ink">Linux   Apache   Docker   AWS   Git</tspan></text>
<path d="M534.5 134V362" stroke="#aacfd1" stroke-opacity=".5"/>
<text x="40" y="494" font-size="12" class="dim">Build. Flash. Ship.</text>
<circle cx="850" cy="490" r="3" fill="#7dffb2"/>
<text x="920" y="494" font-size="12" text-anchor="end" class="dim">online</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>