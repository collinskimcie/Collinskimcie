<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" role="img" aria-label="Animated eDEX-UI style launcher: a short boot log, then a profile for Santan, an embedded systems, full-stack and cybersecurity developer, with a tree of the tech stack" xmlns:c2pa="http://c2pa.org/manifest">
<title>santan@lab</title>
<defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#aacfd1" stroke-opacity="0.035"/></pattern></defs>
<style>
text{font-family:"Fira Code","JetBrains Mono","DejaVu Sans Mono","Courier New",monospace}
.dim{fill:#aacfd1;fill-opacity:.55} .ink{fill:#aacfd1} .hi{fill:#e6f7f8} .ok{fill:#7dffb2}
.line{opacity:0;animation:show .01s linear forwards}
@keyframes show{to{opacity:1}} @keyframes hide{to{opacity:0}}
.boot{animation:hide .4s linear 5.1s forwards}
.main{opacity:0;animation:show .7s linear 5.5s forwards}
.blink{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.boot{display:none} .main{opacity:1;animation:none} .line{opacity:1;animation:none} .blink{animation:none}}
</style>
<rect width="720" height="712" fill="#05080d"/>
<rect width="720" height="712" fill="url(#g)"/>

<g class="boot">
<text x="32" y="64" font-size="14" class="line hi" style="animation-delay:0.25s">eDEX-UI Kernel version 2.2.8 boot at santan@lab</text>
<text x="32" y="112" font-size="14" class="line ok" style="animation-delay:0.89s">[  OK  ] mount /dev/ttyACM0 (ESP32-S3)</text>
<text x="32" y="136" font-size="14" class="line ok" style="animation-delay:1.21s">[  OK  ] load toolchain: PlatformIO</text>
<text x="32" y="160" font-size="14" class="line ok" style="animation-delay:1.53s">[  OK  ] start service: mosquitto, TLS only</text>
<text x="32" y="184" font-size="14" class="line ok" style="animation-delay:1.85s">[  OK  ] start service: docker backend-api</text>
<text x="32" y="208" font-size="14" class="line ok" style="animation-delay:2.17s">[  OK  ] verify firmware image: sha256</text>
<text x="32" y="232" font-size="14" class="line ok" style="animation-delay:2.49s">[  OK  ] arm rollback protection</text>
<text x="32" y="256" font-size="14" class="line ok" style="animation-delay:2.81s">[  OK  ] seal secrets: gitignored</text>
<text x="32" y="304" font-size="14" class="line ink" style="animation-delay:3.45s">Starting graphical interface ...</text>
<text x="32" y="328" font-size="14" class="line hi" style="animation-delay:3.77s">Welcome santan</text>
</g>
<g class="main">
<g fill="none" stroke="#aacfd1" stroke-opacity=".45" stroke-width="1.5"><path d="M12 30V12h18"/><path d="M690 12h18v18"/><path d="M12 682v18h18"/><path d="M690 700h18v-18"/></g>
<text x="32" y="42" font-size="12" class="dim">santan@lab</text>
<text x="688" y="42" font-size="12" text-anchor="end" class="dim">github.com/collinskimcie</text>
<path d="M32 56H688" stroke="#aacfd1" stroke-opacity=".2"/>
<text x="32" y="118" font-size="42" letter-spacing="10" class="hi">SANTAN</text>
<text x="34" y="148" font-size="15" class="ink">Embedded systems, full-stack and cybersecurity</text>
<text x="34" y="198" font-size="14" class="line hi" style="animation-delay:6.00s">santan@lab:~$ cat about.txt</text>
<text x="34" y="222" font-size="14" class="line ink" style="animation-delay:6.45s">I write firmware for ESP32-S3 boards and the tools around</text>
<text x="34" y="246" font-size="14" class="line ink" style="animation-delay:6.90s">them, and build full-stack apps and APIs on top. I build</text>
<text x="34" y="270" font-size="14" class="line ink" style="animation-delay:7.35s">devices to survive being poked at, then I poke at them</text>
<text x="34" y="294" font-size="14" class="line dim" style="animation-delay:7.80s">myself. Only on hardware and networks I own.</text>
<text x="34" y="330" font-size="14" class="line hi" style="animation-delay:8.40s">santan@lab:~$ ./interests</text>
<text x="34" y="354" font-size="14" class="line" style="animation-delay:8.90s"><tspan class="ok">&gt; embedded systems</tspan><tspan class="ok" dx="30">&gt; full-stack development</tspan><tspan class="ok" dx="30">&gt; cybersecurity</tspan></text>
<text x="34" y="378" font-size="14" class="line hi" style="animation-delay:9.30s">santan@lab:~$</text>
<rect x="149.2" y="366" width="8" height="16" class="ink blink line" style="animation-delay:9.30s"/>
<path d="M32 392H688" stroke="#aacfd1" stroke-opacity=".2"/>
<text x="34" y="426" font-size="14" class="line hi" style="animation-delay:10.00s">santan@lab:~$ tree ~/stack</text>
<path d="M48 442V597" stroke="#aacfd1" stroke-opacity=".5"/>
<path d="M48 457h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:10.40s"/>
<text x="72" y="462" font-size="14" class="line hi" style="animation-delay:10.40s">languages</text>
<text x="176" y="462" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:10.55s">C   C++   Python   PHP   JavaScript   TypeScript   C#</text>
<path d="M48 485h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:10.80s"/>
<text x="72" y="490" font-size="14" class="line hi" style="animation-delay:10.80s">backend</text>
<text x="176" y="490" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:10.95s">.NET   Node.js   Express   Django   Laravel</text>
<path d="M48 513h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:11.20s"/>
<text x="72" y="518" font-size="14" class="line hi" style="animation-delay:11.20s">frontend</text>
<text x="176" y="518" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:11.35s">React   Angular</text>
<path d="M48 541h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:11.60s"/>
<text x="72" y="546" font-size="14" class="line hi" style="animation-delay:11.60s">data</text>
<text x="176" y="546" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:11.75s">PostgreSQL   MySQL   MongoDB   Supabase</text>
<path d="M48 569h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:12.00s"/>
<text x="72" y="574" font-size="14" class="line hi" style="animation-delay:12.00s">embedded</text>
<text x="176" y="574" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:12.15s">ESP32-S3   PlatformIO   Arduino   LVGL</text>
<path d="M48 597h14" stroke="#aacfd1" stroke-opacity=".5" class="line" style="animation-delay:12.40s"/>
<text x="72" y="602" font-size="14" class="line hi" style="animation-delay:12.40s">infra</text>
<text x="176" y="602" font-size="14" xml:space="preserve" class="line ink" style="animation-delay:12.55s">Linux   Apache   Docker   AWS   Git</text>
<path d="M32 660H688" stroke="#aacfd1" stroke-opacity=".2"/>
<text x="32" y="686" font-size="12" class="dim">Build. Flash. Ship.</text>
<circle cx="634" cy="682" r="3" fill="#7dffb2"/>
<text x="688" y="686" font-size="12" text-anchor="end" class="dim">online</text>
</g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>